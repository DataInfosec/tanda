[package]
name = "tanda-biometric-verification"
version = "0.1.0"
edition = "2024"

[lib]
name = "biometric_sdk"
crate-type = ["cdylib", "staticlib"]
path = "src/commonMain/rust/src/lib.rs"

[dependencies]
biometric-sdk-core = { package = "biometric-sdk", git = "https://github.com/DataInfosec/biometric-sdk", rev = "546cd1d683cfeae78aea522988707fda60231cd0", default-features = false, features = ["uniffi-bindings"] }
