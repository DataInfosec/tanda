[package]
name = "biometric-sdk"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
repository = "https://github.com/DataInfosec/biometric-sdk"

[dependencies]
fs2 = "0.4.3"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
sha2 = "0.10.9"
uniffi = { version = "0.32.0", default-features = false, optional = true }
uuid = { version = "1.23.4", features = ["v4"] }

[lib]
crate-type = ["rlib", "cdylib", "staticlib"]
path = "src/commonMain/rust/lib.rs"
