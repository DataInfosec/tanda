[package]
name = "tanda-biometric-verification"
version = "0.1.0"
edition = "2024"

[lib]
name = "biometric_sdk"
crate-type = ["cdylib", "staticlib"]
path = "src/commonMain/rust/src/lib.rs"

[dependencies]
biometric-sdk-core = { package = "biometric-sdk", git = "https://github.com/DataInfosec/biometric-sdk", rev = "001d4d4f1880a1222a00f6b21f5ff63c3d442096", default-features = false, features = ["uniffi-bindings"] }
