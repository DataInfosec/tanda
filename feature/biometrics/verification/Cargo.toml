[package]
name = "tanda-biometric-verification"
version = "0.1.0"
edition = "2024"

[lib]
name = "biometric_sdk"
crate-type = ["cdylib", "staticlib"]
path = "src/commonMain/rust/src/lib.rs"

[dependencies]
biometric-sdk-core = { package = "biometric-sdk", git = "https://github.com/DataInfosec/biometric-sdk", rev = "a5e4afe84b6eb7b99a6a48ab9a50e9d07de52af0", default-features = false, features = ["uniffi-bindings"] }
