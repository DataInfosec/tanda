def isAndroid = ext.has('android') && (ext.get('android') as List<String>).contains(path)
def isLibrary = ext.has('library') && (ext.get('library') as List<String>).contains(path)
def isComposable = ext.has('composable') && (ext.get('composable') as List<String>).contains(path)

apply plugin: libs.plugins.ksp.get().pluginId

if (isAndroid) {
    apply from: "$rootDir/gradle/android.gradle"
} else if (isComposable) {
    apply from: "$rootDir/gradle/composable.gradle"
} else if (isLibrary) {
    apply from: "$rootDir/gradle/lib.gradle"
} else {
    apply from: "$rootDir/gradle/default.gradle"
}

android {
    namespace = "com.tanda" + project.path.replace(':', '.')
    compileSdk = libs.versions.android.compileSdk.get().toInteger()
    defaultConfig {
        minSdk = libs.versions.android.minSdk.get().toInteger()
        targetSdk = libs.versions.android.targetSdk.get().toInteger()
    }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }
}

if (!isLibrary) {
    dependencies {
        add("ksp", libs.koin.compiler)
        add("kspCommonMainMetadata", libs.koin.compiler)
    }

    tasks.register("generateDepencencyMain") {
        group = "build"
        description = "Runs KSP on commonMain metadata"
        dependsOn("kspCommonMainKotlinMetadata")
    }

    tasks.configureEach { task ->
        def isKotlinCompilation = task.name.startsWith("compile") &&
                task.name.contains("Kotlin")
        def isPlatformKsp = task.name.startsWith("ksp") &&
                task.name != "kspCommonMainKotlinMetadata"
        if (isKotlinCompilation || isPlatformKsp) {
            task.dependsOn("kspCommonMainKotlinMetadata")
        }
    }
}

kotlin {
    compilerOptions {
        freeCompilerArgs = ["-Xexpect-actual-classes"]
    }
    sourceSets {
        commonMain.dependencies {
            kotlin.sourceSets.getByName("commonMain").kotlin.srcDir(
                    "build/generated/ksp/metadata/commonMain/kotlin"
            )
        }
    }
}
