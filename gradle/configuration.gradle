import java.util.Properties

task("generateBuildConstants") {
    // Inputs/Outputs for configuration cache and incremental build
    inputs.files(rootProject.file("local.properties"))
    def outputDir = layout.buildDirectory.dir("generated/source/buildConfig").get().asFile
    outputs.dir(outputDir)
    doLast {
        Properties props = new Properties()
        def propsFiles = inputs.files.files
        if (!propsFiles.isEmpty()) {
            def propsFile = propsFiles.iterator().next()
            if (propsFile.exists()) {
                propsFile.withInputStream { props.load(it) }
            }
        }
        def baseUrl = props.getProperty("tanda.base.url") ?: ""
        def fingerprintUrl = props.getProperty("tanda.fingerprint.url") ?: ""
        File outputFile = new File(outputDir, "com/tanda/BuildConstants.kt")
        outputFile.parentFile.mkdirs()
        outputFile.text = """
            package com.tanda

            import kotlin.experimental.ExperimentalObjCName
            import kotlin.native.ObjCName
            
            @OptIn(ExperimentalObjCName::class)
            @ObjCName(name = "BuildConstants", exact = true)
            object BuildConstants {
                const val BASE_URL = \"$baseUrl\"
                const val FINGERPRINT_URL = \"$fingerprintUrl\"
            }
        """.stripIndent().trim()
    }
}
